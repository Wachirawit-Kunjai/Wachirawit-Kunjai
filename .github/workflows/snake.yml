name: Generate Snake Animation

on:
  schedule:
    # รันอัตโนมัติทุกๆ 12 ชั่วโมง
    - cron: "0 */12 * * *" 
  workflow_dispatch:
  # ให้รันทุกครั้งที่มีการกด Push ใน branch main
  push:
    branches:
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            # สำหรับธีมสว่าง: บังคับ Palette สีจุดเมื่อโดนกินให้ยังเห็นเป็นสีเขียว
            dist/github-contribution-grid-snake.svg?color_snake=#00FF66&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
            # สำหรับธีมมืด: บังคับ Palette สีจุดเมื่อโดนกินให้ยังเห็นเป็นสีเขียว
            dist/github-contribution-grid-snake-dark.svg?color_snake=#00FF66&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
