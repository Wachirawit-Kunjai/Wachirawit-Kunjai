name: Generate Snake Contribution Animation

on:
  schedule:
    - cron: "0 0 * * *" # รันอัปเดตทุกเที่ยงคืน
  workflow_dispatch:     # กดรันเองได้ตลอดเวลา

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ดึงข้อมูลและสร้างไฟล์งูกิน Contribution Graph
      - name: Generate github-contribution-grid-snake.gif
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Commit และ Push ไฟล์ที่สร้างไปยัง branch output
      - name: Push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
