name: Generate GitHub Jet Heatmap

on:
  schedule:
    # รันอัตโนมัติทุกๆ 12 ชั่วโมง
    - cron: '0 */12 * * *'
  workflow_dispatch: # ปุ่มกดรันเองด้วยมือ

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Node.js
        uses: actions/node-versions@v4
        with:
          node-version: '20'

      - name: Clone Jet Heatmap Source
        run: git clone https://github.com/Sushmitadasari/Sushmitadasari.git temp_src

      - name: Install Dependencies
        run: |
          cd temp_src
          npm install

      - name: Generate Jet Heatmap SVG
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          cd temp_src
          node generate.mjs
          # ก๊อปปี้ไฟล์ SVG ออกมาวางข้างนอก
          cp -r dist/../*.svg ../ 2>/dev/null || true
          cp -r *.svg ../ 2>/dev/null || true

      - name: Commit and Push Generated SVGs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update GitHub Jet Heatmap animation"
          file_pattern: "*.svg dist/*.svg"
